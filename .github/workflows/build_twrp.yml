name: Build TWRP for sheng

on:
  workflow_dispatch: # GitHubのウェブ画面から手動で実行できるようにします

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo docker image prune -a -f
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "PATH=$HOME/bin:$PATH" >> $GITHUB_ENV

      - name: Configure Git
        run: |
          git config --global user.name "Your Name"
          git config --global user.email "your.email@example.com"

      - name: Initialize TWRP Source (Minimal Manifest 12.1)
        run: |
          export PATH=$HOME/bin:$PATH
          mkdir twrp
          cd twrp
          # Android 14端末ですが、TWRPのビルドシステムは12.1ベースが現在最も安定しています
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
      - name: Clone Device Tree
        run: |
          cd twrp
          # 最後に「半角スペース」を空けて「device/xiaomi/sheng」と指定します
          git clone https://github.com/Xiaomi-Pad-6S-Pro12-4-sheng/recovery_device_xiaomi_sheng.git device/xiaomi/sheng
          sed -i '/PRODUCT_STATIC_BOOT_CONTROL_HAL/d' device/xiaomi/sheng/device.mk

      - name: Build TWRP Recovery Image
        run: |
          export PATH=$HOME/bin:$PATH
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          # omni_sheng.mk に基づいてターゲットを設定します
          lunch omni_sheng-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload TWRP Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-sheng-build
          path: |
            twrp/out/target/product/sheng/*.img
            twrp/out/target/product/sheng/*.zip
